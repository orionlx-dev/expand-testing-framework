name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT }}
  ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Debug checkout
        run: |
          echo "=== PWD ==="
          pwd

          echo "=== GIT REMOTE ==="
          git remote -v

          echo "=== GIT STATUS ==="
          git status

          echo "=== GIT BRANCH ==="
          git branch -a

          echo "=== GIT LOG ==="
          git log --oneline -5

          echo "=== FILES ==="
          ls -la

          echo "=== ALL FILES ==="
          find . -maxdepth 3 -type f | sort