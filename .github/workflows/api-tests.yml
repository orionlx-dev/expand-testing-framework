name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  ALLURE_ENDPOINT: ${{ vars.ALLURE_ENDPOINT }}
  ALLURE_PROJECT_ID: ${{ vars.ALLURE_PROJECT_ID }}

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test

      - name: Debug Allure results
        if: always()
        run: |
          echo "Searching for Allure results..."
          find . -type f \( -name "*-result.json" -o -name "*-container.json" \) -print
          echo "Directories:"
          find . -type d -name "*allure*" -print